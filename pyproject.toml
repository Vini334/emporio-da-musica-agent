[project]
name = "emporio-da-musica-agent"
version = "0.1.0"
description = "Agente de atendimento (LLM + tools + RAG) da loja fictícia Empório da Música"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
emporio-chat = "emporio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emporio"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
