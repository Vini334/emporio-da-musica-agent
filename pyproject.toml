[project]
name = "emporio-da-musica-agent"
version = "0.1.0"
description = "Agente de atendimento (LLM + tools + RAG) da loja fictícia Empório da Música"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "fastembed>=0.9.1",
    "holidays>=0.107",
    "langchain>=1.4.8",
    "langchain-google-genai>=4.4.2",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pandas>=3.1.0",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.6",
    "rich>=15.0.0",
    "tzdata>=2026.6",
]

[project.scripts]
emporio-chat = "emporio.cli:main"

[project.optional-dependencies]
anthropic = [
    "langchain-anthropic>=1.7.9",
]
openai = [
    "langchain-openai>=1.7.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emporio"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
